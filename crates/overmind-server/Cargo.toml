[package]
name = "overmind-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "multipart"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# The archive (ADR-0044): tar + gzip, pure Rust on purpose -- the image
# builds on two architectures and a C backend is a second thing to break.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "time",
] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
uuid = { version = "1", features = ["v4", "v7"] }

# One call: `geteuid`, to ask whether we are privileged enough to drop privilege
# (ADR-0029). The standard library has no way to ask, and guessing at it would
# mean guessing at whether a security boundary exists.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
