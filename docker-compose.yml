# Quickstart: `docker compose up --build` → http://localhost:7070
#
# The image brings its own agent CLI, so a task works out of the box once the
# agent can authenticate — see ANTHROPIC_API_KEY below, or `claude login` if you
# are on a subscription. The database, worktrees and (optional) managed brains
# persist on a named volume; so do the agent's credentials.

services:
  overmind:
    # Agents work with the tools the image carries (git, gh, ripgrep, python,
    # node). If yours need more -- a LaTeX toolchain, a linter, a compiler --
    # add it at build time instead of deriving an image:
    #   docker compose build --build-arg EXTRA_APT_PACKAGES="texlive-latex-base"
    build: .
    image: overmind:latest
    ports:
      # Loopback ONLY, on purpose. Overmind has no authentication, and its API
      # starts tasks that run a CLI on this machine — publishing it on every
      # interface would hand anyone who can reach the port the ability to run
      # commands here. Do not change this to "7070:7070" until auth lands;
      # to reach it from another machine, tunnel: `ssh -L 7070:localhost:7070`.
      - "127.0.0.1:7070:7070"
    volumes:
      - overmind-data:/data
      # The agent's credentials, kept across rebuilds.
      #
      # The CLI writes its session under the agent's $HOME, which is not on
      # /data — without this volume a `claude login` is lost on the next
      # `docker compose up --build`, and the failure looks like a login that
      # never sticks. Mounted by default because "your sign-in survives" is not
      # a thing anyone should have to opt into. The server takes ownership of it
      # at startup: a fresh named volume arrives owned by root, and the agent is
      # not root (ADR-0029).
      - overmind-agent-home:/home/agent/.claude
      # Repositories agents work on. Uncomment and point at yours:
      # - ${HOME}/code:/repos:rw
      #
      # A workspace's `cwd` is then the IN-CONTAINER path — /repos/your-project,
      # not /Users/you/code/your-project. If you get that wrong the server now
      # tells you what it can actually see, rather than "not a directory".
      #
      # On Linux the mounted files keep their host ownership, and the agent runs
      # as uid 10001, so a `code` task may not be able to write them. Set
      # OVERMIND_AGENT_UID (and _GID) below to your own `id -u` if so — the
      # boundary is that the agent is not the *server*, and any unprivileged uid
      # holds it.

    environment:
      # How the agent authenticates — and the order matters more than it looks.
      #
      # `ANTHROPIC_API_KEY` **takes precedence over a claude.ai login**; the CLI
      # says so out loud when both are present. So a subscription is not
      # something you prefer, it is something you get by *not* setting a key —
      # which is why this is a passthrough (a bare name, forwarded only when it
      # exists on the host) and not an assignment. Written `KEY: ${KEY:-}` it
      # would be defined-and-empty in every container, and "I signed in and it
      # billed my key anyway" is a bad afternoon.
      - ANTHROPIC_API_KEY
      #
      # For a subscription instead, sign in once — the volume above keeps it:
      #   docker compose exec --user agent overmind claude setup-token
      #
      # Align the agent with your host user so it can write mounted repositories:
      # - OVERMIND_AGENT_UID=1000
      # - OVERMIND_AGENT_GID=1000
      #
      # Organizational memory is ON by default: the image bakes in Wadachi
      # (semantic search, model included — ADR-0031) and each company gets its
      # own brain under /data (ADR-0024). To swap in another MCP memory
      # server, name it here; leave BRAIN_DIR out of the command — Overmind
      # sets it per company, and a shell assignment here would override it and
      # put every company back in one brain.
      # - OVERMIND_MEMORY_CMD=my-memory-server
      # Disable memory deliberately (empty means none):
      # - OVERMIND_MEMORY_CMD=
      # - OVERMIND_MEMORY_POOL=4
      # Deliberately share one brain instead of one per company:
      # - OVERMIND_MANAGED_BRAIN=off
    restart: unless-stopped

volumes:
  overmind-data:
  overmind-agent-home:
