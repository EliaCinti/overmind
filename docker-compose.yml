# Quickstart -- this file and Docker are the whole install:
#
#   docker compose up -d --pull always      → http://localhost:7070
#
# The same line is the UPDATE: `--pull always` fetches the newest published
# image before starting, so "a new version is out" means running it again --
# not a rebuild, not a reinstall. The image brings its own agent CLI, so a
# task works out of the box once the agent can authenticate -- see
# ANTHROPIC_API_KEY below, or the subscription sign-in. The database,
# worktrees, managed brains and the agent's credentials live in `./data` and
# `./agent`, beside this file (ADR-0047). Logs: `docker logs -f overmind`.
#
# `--pull always` asks the registry every time. Offline -- a plane, a captive
# portal, a registry outage -- plain `docker compose up -d` starts the image
# you already have.
#
# This file names the PUBLISHED image and nothing else, on purpose. Building
# from source is a developer's path and lives in docker-compose.build.yml
# (ADR-0043): when one compose declares both `image:` and `build:`, "which
# one am I running?" has no honest answer -- a local `up --build` once claimed
# the `latest` tag, and a friend's `docker compose pull` landed no visible new
# version until everything was deleted and downloaded again. In a clone of
# the repository `docker compose up --build` therefore builds NOTHING now; the
# from-source command is in that other file.

# No fixed project name any more (ADR-0047 supersedes ADR-0043 on this point).
# It used to be pinned so an update from another directory found your data --
# true of a named volume, meaningless now that the data is `./data` beside
# this file. And pinned it made the folder NOT the unit of installation: a
# second folder would target the same Compose project, collide on the
# container name, and `docker compose down` in one would stop the other.
# Compose takes the project from the directory, so two folders are two
# instances -- which is what "the folder is the installation" has to mean.
#
# That reasoning holds only while the folders have DIFFERENT names, and since
# 3 Sep 2026 the installer makes a folder called `overmind` beside whoever ran
# it -- so every default install would share one project. The identity is
# written into a `.env` beside this file instead: COMPOSE_PROJECT_NAME,
# OVERMIND_NAME and OVERMIND_PORT, derived from the folder's full path. Absent
# that file the defaults below are the old single-instance behaviour, which is
# right for anyone who put this file somewhere by hand.

services:
  overmind:
    # Multi-arch (amd64 + arm64), built by the release workflow on every
    # version tag. Pin a version instead of `latest` if you want an update to
    # be a decision rather than a side effect: ghcr.io/eliacinti/overmind:X.Y.Z
    # (every release's tag is on its GitHub Release page).
    #
    # Agents work with the tools the image carries (git, gh, ripgrep, python,
    # node). If yours need more -- a LaTeX toolchain, a linter, a compiler --
    # build from this tree with docker-compose.build.yml and its
    # EXTRA_APT_PACKAGES argument instead of deriving an image.
    # So it is `docker logs overmind`, not `overmind-overmind-1` — Compose
    # builds that name from <project>-<service>-<index>, and here both are
    # the same word.
    container_name: ${OVERMIND_NAME:-overmind}
    image: ghcr.io/eliacinti/overmind:latest
    ports:
      # Loopback ONLY, on purpose. Since M24 the API answers to a credential
      # (the owner claims the instance at first run; everyone after joins by
      # invite), but reaching out is a decision, never a surprise: an
      # UNCLAIMED instance is open, and the API starts tasks that run a CLI on
      # this machine. To share it with someone, publish it on your tailnet
      # address and nothing else -- "100.x.y.z:7070:7070" -- and claim the
      # owner account before you share the address (ADR-0032, ADR-0033). For a
      # public hostname, terminate TLS in a reverse proxy that preserves Host
      # and set OVERMIND_COOKIE_SECURE=on. Never "0.0.0.0:7070:7070".
      - "127.0.0.1:${OVERMIND_PORT:-7070}:7070"
    volumes:
      # THE FOLDER THIS FILE IS IN *IS* THE INSTALLATION (ADR-0047). Docker
      # creates it on the first start; everything Overmind keeps lives here,
      # in plain sight, and you move the whole install by moving this folder.
      # `docker compose down -v` cannot touch it — that flag removes named
      # volumes, and this is not one.
      #
      # The other side of that: run `docker compose` from somewhere else and
      # you get an empty instance, because `./data` is somewhere else too.
      # Keep this file and its folders together. To put the data elsewhere on
      # purpose, set OVERMIND_DATA to an absolute path, in a `.env` beside
      # this file or in your shell — absolute, or at least starting with
      # `./`: Compose reads a bare `mydata` as a *named volume*, which hands
      # your instance back to `down -v`. It must also be a filesystem that
      # honours ownership: the cage (ADR-0029) gives run directories to the
      # agent uid with chown, and on exFAT, NTFS or a network share that is
      # either decorative or an outright failure.
      - ${OVERMIND_DATA:-./data}:/data
      # The agent's credentials, kept across updates.
      #
      # The CLI writes its session under the agent's $HOME, which is not on
      # /data — without this volume a `claude login` is lost on the next
      # image update, and the failure looks like a login that never sticks.
      # Mounted by default because "your sign-in survives" is not a thing
      # anyone should have to opt into. The server takes ownership of it
      # at startup: a fresh named volume arrives owned by root, and the agent is
      # not root (ADR-0029).
      - ${OVERMIND_AGENT_DIR:-./agent}:/home/agent/.claude
      # Repositories agents work on. Uncomment and point at yours:
      # - ${HOME}/code:/repos:rw
      #
      # A workspace's `cwd` is then the IN-CONTAINER path — /repos/your-project,
      # not /Users/you/code/your-project. If you get that wrong the server now
      # tells you what it can actually see, rather than "not a directory".
      #
      # On Linux the mounted files keep their host ownership, and the agent runs
      # as uid 10001, so a `code` task may not be able to write them. Set
      # OVERMIND_AGENT_UID (and _GID) below to your own `id -u` if so — the
      # boundary is that the agent is not the *server*, and any unprivileged uid
      # holds it.

    environment:
      # How the agent authenticates — and the order matters more than it looks.
      #
      # `ANTHROPIC_API_KEY` **takes precedence over a claude.ai login**; the CLI
      # says so out loud when both are present. So a subscription is not
      # something you prefer, it is something you get by *not* setting a key —
      # which is why this is a passthrough (a bare name, forwarded only when it
      # exists on the host) and not an assignment. Written `KEY: ${KEY:-}` it
      # would be defined-and-empty in every container, and "I signed in and it
      # billed my key anyway" is a bad afternoon.
      - ANTHROPIC_API_KEY
      #
      # For a subscription instead, sign in once — the volume above keeps it:
      #   docker compose exec --user agent overmind claude setup-token
      #
      # The container SHOWS time in UTC unless told a timezone; the clock
      # underneath is the host's either way. Set this only so logs and
      # `date` read in your local time — it cannot fix (or break) a clock:
      # - TZ=Europe/Rome
      #
      # Align the agent with your host user so it can write mounted repositories:
      # - OVERMIND_AGENT_UID=1000
      # - OVERMIND_AGENT_GID=1000
      #
      # Organizational memory is ON by default: the image bakes in Wadachi
      # (semantic search, model included — ADR-0031) and each company gets its
      # own brain under /data (ADR-0024). To swap in another MCP memory
      # server, name it here; leave BRAIN_DIR out of the command — Overmind
      # sets it per company, and a shell assignment here would override it and
      # put every company back in one brain.
      # - OVERMIND_MEMORY_CMD=my-memory-server
      # Disable memory deliberately (empty means none):
      # - OVERMIND_MEMORY_CMD=
      # - OVERMIND_MEMORY_POOL=4
      # Deliberately share one brain instead of one per company:
      # - OVERMIND_MANAGED_BRAIN=off
    restart: unless-stopped

# No `volumes:` block any more: nothing here is a Docker-managed volume.
# `./data` holds the database, every company's brain, the audit chain,
# attachments, artifacts and the subscription token; `./agent` holds the agent
# CLI's own sign-in — the one thing an archive does not carry, because it is
# set by `claude setup-token` rather than from the product. If you signed in
# that way, copy that folder too.
#
# The everyday safety net is still the archive: `POST /api/backup`, or the
# Backups button, owner only — one file with the database, every brain,
# attachments and artifacts, the sign-in sealed under a passphrase you choose
# (ADR-0044). `POST /api/restore` takes it back into an EMPTY instance.
