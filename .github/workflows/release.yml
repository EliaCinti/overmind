name: Release

# On a version tag: build the image for both platforms people actually run --
# amd64 (a Linux box, a VPS, Windows through Docker Desktop on Intel) and
# arm64 (Apple Silicon, and arm Linux) -- each natively on its own runner,
# push both by digest, unite them under one manifest tagged with the version
# and `latest`, and publish a GitHub Release whose notes are the changelog's
# entry for that version. The image is how everyone who is not on macOS has
# Overmind, and how macOS has it too without a Rust toolchain; publishing it
# is what turns `docker compose up` from a seven-minute build into a download.
#
# 0.1.0 shipped amd64 alone, and the very first `docker compose pull` on an
# Apple Silicon Mac answered "no matching manifest for linux/arm64" -- the
# owner's machine. Measured, not assumed, from then on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/eliacinti/overmind

jobs:
  build:
    name: the image, ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: the image, united
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    name: the release notes
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - uses: actions/checkout@v5
      # The notes are the changelog's entry for this version -- one source,
      # not a second summary that drifts from it.
      - name: Extract this version's changelog entry
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; print; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no changelog entry for $v"; exit 1; }
          cat notes.md
      # The installers carry their own release's tag and the digest of the
      # compose file that release publishes (ADR-0045). Stamped here rather
      # than fetched at run time: the file and the hash it is checked against
      # then come from one place, and no release cut can land between two
      # requests. Their own checksums ride along, so somebody who would rather
      # read the script before running it can verify what they read.
      - name: Stamp the installers with this release
        run: |
          v="${GITHUB_REF_NAME}"
          sha=$(sha256sum docker-compose.yml | cut -d' ' -f1)
          for f in scripts/install.sh scripts/install.ps1; do
            sed -i "s|__OVERMIND_TAG__|${v}|g; s|__OVERMIND_COMPOSE_SHA256__|${sha}|g" "$f"
            grep -q "__OVERMIND_" "$f" && { echo "$f still has a placeholder"; exit 1; }
            cp "$f" "$(basename "$f")"
          done
          sha256sum install.sh   | cut -d' ' -f1 > install.sh.sha256
          sha256sum install.ps1  | cut -d' ' -f1 > install.ps1.sha256
          echo "compose sha256: $sha"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: false
          # The install is one file on top of Docker: ship that file with
          # every release so nobody has to clone a repository to run an image.
          # It names `latest` -- a release asset is where you get the file,
          # not a pin; the one update line keeps working from it. The two
          # installers and their checksums ride with it.
          files: |
            docker-compose.yml
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
